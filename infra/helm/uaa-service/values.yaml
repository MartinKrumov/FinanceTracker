replicaCount: 1

image:
  repository: sevenup3/uaa-service
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8082

service:
  port: 8082

env:
  SPRING_PROFILES_ACTIVE: prod

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 750m
    memory: 768Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 40
    periodSeconds: 10
    failureThreshold: 5
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 50
    periodSeconds: 15

lifecycle:
  preStopSleepSeconds: 10
