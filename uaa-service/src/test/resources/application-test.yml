logging:
  level:
    com.tracker: debug

spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    kubernetes:
      enabled: false
  liquibase:
    change-log: classpath:db/changelog/master.xml
  jpa:
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://DO_NOT_CALL/realms/finance-tracker
