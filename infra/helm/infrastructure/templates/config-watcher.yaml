apiVersion: v1
kind: ServiceAccount
metadata:
  name: spring-cloud-kubernetes-configuration-watcher
  labels:
    app: spring-cloud-kubernetes-configuration-watcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-reader
rules:
  - apiGroups: ["", "extensions", "apps"]
    resources: ["configmaps", "pods", "services", "endpoints", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spring-cloud-kubernetes-configuration-watcher:view
  labels:
    app: spring-cloud-kubernetes-configuration-watcher
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: namespace-reader
subjects:
  - kind: ServiceAccount
    name: spring-cloud-kubernetes-configuration-watcher
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-cloud-kubernetes-configuration-watcher-deployment
spec:
  selector:
    matchLabels:
      app: spring-cloud-kubernetes-configuration-watcher
  template:
    metadata:
      labels:
        app: spring-cloud-kubernetes-configuration-watcher
    spec:
      serviceAccount: spring-cloud-kubernetes-configuration-watcher
      containers:
        - name: spring-cloud-kubernetes-configuration-watcher
          image: {{ .Values.configWatcher.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.configWatcher.port }}
          readinessProbe:
            httpGet:
              port: {{ .Values.configWatcher.port }}
              path: /actuator/health/readiness
          livenessProbe:
            httpGet:
              port: {{ .Values.configWatcher.port }}
              path: /actuator/health/liveness
          resources:
            {{- toYaml .Values.configWatcher.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: spring-cloud-kubernetes-configuration-watcher
  labels:
    app: spring-cloud-kubernetes-configuration-watcher
spec:
  ports:
    - name: http
      port: {{ .Values.configWatcher.port }}
      targetPort: {{ .Values.configWatcher.port }}
  selector:
    app: spring-cloud-kubernetes-configuration-watcher
  type: ClusterIP
